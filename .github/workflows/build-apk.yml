name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar fuente única Guía 21
        id: prep
        run: |
          set -euo pipefail
          PACKAGE="BILLAR_8_PRO_TODO (3).zip"
          if [ ! -f "$PACKAGE" ]; then
            echo "::error::No está el paquete único $PACKAGE"
            exit 1
          fi
          mkdir -p _package _src _apk/www
          unzip -oq "$PACKAGE" -d _package
          KEYSTORE=$(find _package -type f -name debug.keystore | head -1)
          INNERZIP=$(find _package -type f -name 'BILLAR_8_PRO_CORREGIDO (17).zip' | head -1)
          if [ -z "$KEYSTORE" ] || [ -z "$INNERZIP" ]; then
            echo "::error::El paquete no contiene debug.keystore o el ZIP fuente (17)"
            exit 1
          fi
          cp "$KEYSTORE" ./debug.keystore
          unzip -oq "$INNERZIP" -d _src
          SRC=$(find _src -type f -path '*/JUEGO_BILLAR_8_PRO/index.html' -print -quit | xargs -r dirname)
          if [ -z "$SRC" ] || [ ! -f "$SRC/index.html" ]; then
            echo "::error::No se encontró index.html del juego"
            exit 1
          fi
          APPV=$(grep -o "APPV = '[^']*'" "$SRC/index.html" | head -1 | sed "s/APPV = '//; s/'//")
          if [ "$APPV" != "guia-21" ]; then
            echo "::error::Se esperaba guia-21 pero el archivo fuente contiene $APPV"
            exit 1
          fi
          cp -a "$SRC"/. _apk/www/
          rm -f _apk/www/admin.html _apk/www/reglas_firestore.txt _apk/www/_headers
          echo "Versión comprobada: $APPV"
          echo "appv=$APPV" >> "$GITHUB_OUTPUT"
          {
            echo "### Versión del juego en este APK: **$APPV**"
            echo "Fuente única: `$PACKAGE` → ZIP corregido (17)"
            echo "Verificación: el proceso se detiene si no encuentra guia-21."
            echo "Firma: debug.keystore incluido en el paquete"
          } >> "$GITHUB_STEP_SUMMARY"

          cd _apk
          npm init -y >/dev/null
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.billar8pro.app",
            "appName": "Billar 8 Pro",
            "webDir": "www",
            "server": { "androidScheme": "https" }
          }
          EOF
          npx cap add android
          npx cap sync android
          sed -i "s/versionCode [0-9][0-9]*/versionCode ${GITHUB_RUN_NUMBER}/; s/versionName \"[^\"]*\"/versionName \"${APPV}\"/" android/app/build.gradle
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.CAMERA"/><uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/></manifest>#' android/app/src/main/AndroidManifest.xml

      - name: Aplicar firma fija
        run: |
          set -e
          test -f debug.keystore
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
          echo "Se usará la misma clave fija para permitir actualizar sobre instalaciones anteriores."

      - name: Compilar APK
        working-directory: _apk/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: billar-8-pro-guia-21
          path: _apk/android/app/build/outputs/apk/debug/app-debug.apk
