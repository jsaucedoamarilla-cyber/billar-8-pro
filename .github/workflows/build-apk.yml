name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar el juego (usa SIEMPRE la versión más nueva)
        id: prep
        run: |
          set -euo pipefail
          mkdir -p _apk/www
          # 1) Descomprimir TODOS los zip del repositorio (incluso zip dentro de zip), sin depender de los nombres
          for nivel in 1 2 3 4; do
            while IFS= read -r -d '' z; do
              d="${z%.zip}_x"
              [ -d "$d" ] && continue
              mkdir -p "$d"; unzip -oq "$z" -d "$d" || true
            done < <(find . \( -path ./_apk -o -path ./node_modules -o -path ./.git \) -prune -o -type f -name '*.zip' -print0)
          done
          # 2) Elegir la versión MÁS ALTA del juego entre todo lo que haya (carpeta suelta o zips)
          BEST=""; BESTV=-1
          {
            echo "### Versiones del juego encontradas en el repositorio"
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r -d '' f; do
            v=$(grep -o "APPV = 'guia-[0-9]*" "$f" | head -1 | grep -o '[0-9]*$' || true); v=${v:-0}
            echo "  $f -> guia-$v"
            echo "- \`$f\` → guia-$v" >> "$GITHUB_STEP_SUMMARY"
            if [ "$v" -gt "$BESTV" ]; then BESTV=$v; BEST="$f"; fi
          done < <(find . \( -path ./_apk -o -path ./node_modules -o -path ./.git \) -prune -o -type f -name index.html -path '*JUEGO_BILLAR_8_PRO*' -print0)
          if [ -z "$BEST" ]; then
            echo "::error::No se encontró ningún index.html del juego (carpeta JUEGO_BILLAR_8_PRO) en el repositorio"
            exit 1
          fi
          SRC=$(dirname "$BEST")
          KEYSTORE=$(find . \( -path ./_apk -o -path ./node_modules -o -path ./.git \) -prune -o -type f -name debug.keystore -print | head -1)
          if [ -n "$KEYSTORE" ]; then
            [ "$KEYSTORE" = "./debug.keystore" ] || cp "$KEYSTORE" ./debug.keystore
          else
            echo "::error::No se encontró debug.keystore (hace falta para firmar igual que las versiones anteriores)"
            exit 1
          fi
          APPV=$(grep -o "APPV = '[^']*'" "$SRC/index.html" | head -1 | sed "s/APPV = '//; s/'//")
          case "$APPV" in guia-*) ;; *)
            echo "::error::El archivo fuente no tiene versión guia-N (contiene: $APPV)"
            exit 1 ;;
          esac
          cp -a "$SRC"/. _apk/www/
          rm -f _apk/www/admin.html _apk/www/reglas_firestore.txt _apk/www/_headers
          echo "Versión elegida: $APPV  (de $BEST)"
          echo "appv=$APPV" >> "$GITHUB_OUTPUT"
          {
            echo ""
            echo "### Versión del juego en este APK: **$APPV**"
            echo "Fuente elegida: \`$BEST\`"
            echo "Firma: \`$KEYSTORE\`"
          } >> "$GITHUB_STEP_SUMMARY"

          cd _apk
          npm init -y >/dev/null
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor-firebase/authentication@6 firebase@10

          # --- Datos del acceso con Google / Facebook (archivos en la RAÍZ del repositorio) ---
          FB_APP_ID=""; FB_CLIENT_TOKEN=""
          if [ -f ../facebook.env ]; then
            set -a; . ../facebook.env; set +a
          fi
          PROVIDERS='["google.com"]'
          if [ -n "${FB_APP_ID:-}" ] && [ -n "${FB_CLIENT_TOKEN:-}" ]; then PROVIDERS='["google.com","facebook.com"]'; fi
          cat > capacitor.config.json <<EOF
          {
            "appId": "com.billar8pro.app",
            "appName": "Billar 8 Pro",
            "webDir": "www",
            "server": { "androidScheme": "https" },
            "plugins": { "FirebaseAuthentication": { "skipNativeAuth": true, "providers": $PROVIDERS } }
          }
          EOF
          npx cap add android
          npx cap sync android
          sed -i "s/versionCode [0-9][0-9]*/versionCode ${GITHUB_RUN_NUMBER}/; s/versionName \"[^\"]*\"/versionName \"${APPV}\"/" android/app/build.gradle
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.CAMERA"/><uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/></manifest>#' android/app/src/main/AndroidManifest.xml

          if [ -f ../google-services.json ]; then
            cp ../google-services.json android/app/google-services.json
            echo "Google: google-services.json incluido" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Falta google-services.json en la raíz del repositorio: el acceso con Google NO funcionará en el APK"
            echo "⚠️ Falta google-services.json: Google no funcionará en el APK" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$PROVIDERS" != '["google.com"]' ]; then
            python3 - <<PY
          import re
          app_id="$FB_APP_ID"; token="$FB_CLIENT_TOKEN"
          sp='android/app/src/main/res/values/strings.xml'
          t=open(sp,encoding='utf-8').read()
          add=('<string name="facebook_app_id">%s</string>\n'
               '<string name="facebook_client_token">%s</string>\n'
               '<string name="fb_login_protocol_scheme">fb%s</string>\n') % (app_id,token,app_id)
          t=t.replace('</resources>', add+'</resources>')
          open(sp,'w',encoding='utf-8').write(t)
          mp='android/app/src/main/AndroidManifest.xml'
          m=open(mp,encoding='utf-8').read()
          meta=('<meta-data android:name="com.facebook.sdk.ApplicationId" android:value="@string/facebook_app_id"/>'
                '<meta-data android:name="com.facebook.sdk.ClientToken" android:value="@string/facebook_client_token"/>')
          m=m.replace('</application>', meta+'</application>')
          open(mp,'w',encoding='utf-8').write(m)
          PY
            echo "Facebook: configurado (App ID $FB_APP_ID)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ Falta facebook.env: Facebook no funcionará en el APK (Google sí)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Aplicar firma fija
        run: |
          set -e
          test -f debug.keystore
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
          echo "Se usará la misma clave fija para permitir actualizar sobre instalaciones anteriores."

      - name: Compilar APK
        working-directory: _apk/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: billar-8-pro-${{ steps.prep.outputs.appv }}
          path: _apk/android/app/build/outputs/apk/debug/app-debug.apk
