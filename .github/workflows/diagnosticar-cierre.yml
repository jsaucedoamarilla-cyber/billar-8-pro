name: Diagnosticar cierre del APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Compilar APK con Firebase nativo activado
        run: |
          set -e
          bash -n build-apk.sh
          bash build-apk.sh
          test -f _out/app-debug.apk
      - name: Instalar y abrir en emulador Android, recoger logcat
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: |
            set +e
            adb install -r _out/app-debug.apk
            echo "INSTALL_EXIT=$?" | tee diagnostico.txt
            adb logcat -c
            adb shell monkey -p com.billar8pro.app -c android.intent.category.LAUNCHER 1
            echo "LAUNCH_SENT=$?" | tee -a diagnostico.txt
            sleep 25
            adb logcat -d -v time > logcat.txt
            echo "=== FATAL EXCEPTION ===" >> diagnostico.txt
            awk '/FATAL EXCEPTION/{show=1;lines=0} show{print;lines++;if(lines>=100)show=0}' logcat.txt >> diagnostico.txt
            if ! grep -q "FATAL EXCEPTION" logcat.txt; then
              echo "No se detectó FATAL EXCEPTION en el logcat capturado." >> diagnostico.txt
              grep -E "AndroidRuntime|com.billar8pro.app|Firebase|Capacitor" logcat.txt | tail -120 >> diagnostico.txt
            fi
            cat diagnostico.txt
            {
              echo "## Diagnóstico de arranque Android"
              echo "Resumen del log:"
              cat diagnostico.txt
            } >> "$GITHUB_STEP_SUMMARY"
      - name: Guardar logcat y diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logcat-diagnostico-apk
          path: |
            logcat.txt
            diagnostico.txt
          if-no-files-found: warn
      - name: Guardar APK de prueba
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: billar-8-pro-diagnostico-native
          path: _out/app-debug.apk
          if-no-files-found: error
