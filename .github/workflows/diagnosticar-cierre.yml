name: Diagnosticar cierre del APK
# Se ejecuta manualmente para no lanzar dos compilaciones pesadas en paralelo con Build APK.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      ANDROID_I_WANT_MY_TCG: "yes"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Compilar APK con Firebase nativo activado
        run: |
          set -e
          bash -n build-apk.sh
          bash build-apk.sh
          test -f _out/app-debug.apk
          echo "APK compilado correctamente." | tee diagnostico.txt

      - name: Instalar y abrir en emulador Android, recoger logcat
        id: emulator-test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            set +e
            INSTALL_EXIT=1
            for attempt in 1 2 3; do
              echo "Intento de instalación $attempt/3" | tee -a diagnostico.txt
              adb wait-for-device
              adb shell getprop sys.boot_completed | grep -q 1 || sleep 10
              adb install -r _out/app-debug.apk
              INSTALL_EXIT=$?
              if [ "$INSTALL_EXIT" -eq 0 ]; then
                break
              fi
              echo "Instalación fallida en intento $attempt (código $INSTALL_EXIT)." | tee -a diagnostico.txt
              sleep 15
            done
            echo "INSTALL_EXIT=$INSTALL_EXIT" | tee -a diagnostico.txt
            if [ "$INSTALL_EXIT" -ne 0 ]; then
              echo "EMULADOR_ERROR: no se pudo instalar tras 3 intentos; esto no demuestra que el APK esté dañado." | tee -a diagnostico.txt
              adb logcat -d -v time > logcat.txt || true
              {
                echo "## Diagnóstico Android"
                echo "**APK compilado:** Sí"
                echo "**Prueba de instalación:** No completada; el emulador/ADB falló tras 3 intentos."
                echo "**APK válido/arranque confirmado:** No se puede concluir."
                cat diagnostico.txt
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            adb logcat -c
            adb shell monkey -p com.billar8pro.app -c android.intent.category.LAUNCHER 1
            LAUNCH_EXIT=$?
            echo "LAUNCH_SENT=$LAUNCH_EXIT" | tee -a diagnostico.txt
            sleep 25
            PID=$(adb shell pidof com.billar8pro.app | tr -d '\r' || true)
            echo "APP_PID=$PID" | tee -a diagnostico.txt
            if [ -z "$PID" ]; then
              echo "ERROR: App no quedó ejecutándose tras abrir." | tee -a diagnostico.txt
              adb logcat -d -v time > logcat.txt
              exit 1
            fi
            adb logcat -d -v time > logcat.txt
            echo "=== FATAL EXCEPTION ===" >> diagnostico.txt
            awk '/FATAL EXCEPTION/{show=1;lines=0} show{print;lines++;if(lines>=100)show=0}' logcat.txt >> diagnostico.txt
            if grep -q "FATAL EXCEPTION" logcat.txt; then
              echo "ERROR: FATAL EXCEPTION detectado al iniciar." >> diagnostico.txt
              exit 1
            fi
            if ! grep -q "FATAL EXCEPTION" logcat.txt; then
              echo "No se detectó FATAL EXCEPTION en logcat." >> diagnostico.txt
              grep -E "AndroidRuntime|com.billar8pro.app|Firebase|Capacitor" logcat.txt | tail -120 >> diagnostico.txt
            fi
            cat diagnostico.txt
            {
              echo "## Diagnóstico de arranque Android"
              cat diagnostico.txt
            } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar logcat y diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logcat-diagnostico-apk
          path: |
            logcat.txt
            diagnostico.txt
          if-no-files-found: warn

      - name: Guardar APK compilado para prueba manual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: billar-8-pro-diagnostico-native
          path: _out/app-debug.apk
          if-no-files-found: error
